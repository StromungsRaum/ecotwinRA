<!--
  Shared SIMOD credentials dialog - one Secret, used by every provider that
  talks to the SIMOD backend. Email and backend URL are prefilled from the
  existing Secret when there is one; the password field is always blank.
-->
<ui5-dialog header-text="Set SIMOD Credentials" [open]="open" (close)="cancel()">
  <div class="dialog-content">
    <ui5-text>
      The injection molding and materials providers use these credentials to reach the
      StrömungsRaum/SIMOD backend. Set once, shared by every provider, and stay in place even
      if you disable and re-enable services.
    </ui5-text>
    <div class="form-field">
      <ui5-label for="simod-base-url">Backend URL</ui5-label>
      <ui5-input id="simod-base-url" type="URL" [value]="baseUrl()" (input)="onBaseUrlInput($event)"></ui5-input>
    </div>
    <div class="form-field">
      <ui5-label for="simod-email" required>Email</ui5-label>
      <ui5-input id="simod-email" type="Email" [value]="email()" (input)="onEmailInput($event)"></ui5-input>
    </div>
    <div class="form-field">
      <ui5-label for="simod-password" required>Password</ui5-label>
      <ui5-input id="simod-password" type="Password" [value]="password()" (input)="onPasswordInput($event)"></ui5-input>
    </div>
  </div>
  <div slot="footer" class="dialog-footer">
    <ui5-button design="Transparent" (click)="cancel()">Cancel</ui5-button>
    <ui5-button design="Emphasized" [disabled]="saving()" (click)="submit()">Save</ui5-button>
  </div>
</ui5-dialog>
