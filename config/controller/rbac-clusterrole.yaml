apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ianus-controller
rules:
  # Full access to SIMOD resources (Component, DigitalTwin,
  # ExecutionParameter, Simulation)
  - apiGroups: ["ianus.platform-mesh.io"]
    resources: ["components", "digitaltwins", "executionparameters", "simulations"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["ianus.platform-mesh.io"]
    resources: ["components/status", "digitaltwins/status", "executionparameters/status", "simulations/status"]
    verbs: ["get", "update", "patch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Access to APIExport for controller operations
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    verbs: ["*"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["get", "list", "watch"]
