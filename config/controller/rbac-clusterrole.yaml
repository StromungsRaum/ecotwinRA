apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ianus-controller
rules:
  # Full access to Models resources
  - apiGroups: ["ianus.platform-mesh.io"]
    resources: ["models"]
    verbs: ["list"]
  - apiGroups: ["ianus.platform-mesh.io"]
    resources: ["models/status"]
    verbs: ["get", "update", "patch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Access to APIExport for controller operations
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    verbs: ["*"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["get", "list", "watch"]
