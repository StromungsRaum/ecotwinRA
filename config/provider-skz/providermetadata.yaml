apiVersion: ui.platform-mesh.io/v1alpha1
kind: ProviderMetadata
metadata:
  name: skz.platform-mesh.io
spec:
  displayName: SKZ - Das Kunststoff-Zentrum
  description: |
    SKZ - Das Kunststoff-Zentrum is a German plastics research, testing and
    training institute (Wurzburg, founded 1961). Its injection molding work has
    supported companies in process optimization and quality assurance since the
    institute's founding, backed by a certified technical center with injection
    molding machines from 800 to 5,000 kN.

    This is a dummy/demo provider: it has no real connection to SKZ and exists
    to illustrate a multi-provider provisioning story - a customer provisions
    this provider to capture a material's parameters, then provisions the
    IANUS Simulation - Injection Molding Service provider to run a simulation.
  contacts:
    - displayName: IANUS Simulation Team
      email: ecotwin@ianus-simulation.de
      role: ["Maintainer"]
  preferredSupportChannels:
    - displayName: IANUS Simulation Support
      url: https://github.com/StromungsRaum/ecotwinRA
  icon:
    light:
      data: "data:image/png;base64,"
    dark:
      data: "data:image/svg+xml;base64,"
