apiVersion: ui.platform-mesh.io/v1alpha1
kind: ProviderMetadata
metadata:
  name: genericmaterials.platform-mesh.io
spec:
  displayName: Generic Materials Service
  description: |
    A vendor-neutral catalog of characterized plastics materials (viscosity,
    heat, temperature-shift, PVT, mechanical and shrinkage data), offered
    read-only: every account that enables this service sees the same materials.

    This is a dummy/demo provider: the catalog is static sample data with no
    material-testing lab behind it. It exists to illustrate a multi-provider
    provisioning story - a customer picks a material here, then uses the
    IANUS Simulation providers to submit it and run a simulation.
  contacts:
    - displayName: IANUS Simulation Team
      email: ecotwin@ianus-simulation.de
      role: ["Maintainer"]
  preferredSupportChannels:
    - displayName: IANUS Simulation Support
      url: https://github.com/StromungsRaum/ecotwinRA
  icon:
    light:
      data: "data:image/svg+xml;base64,"
    dark:
      data: "data:image/svg+xml;base64,"
