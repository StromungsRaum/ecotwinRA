apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v261104-c1fdfbd.materialcatalogs.materials.platform-mesh.io
spec:
  group: materials.platform-mesh.io
  names:
    kind: MaterialCatalog
    listKind: MaterialCatalogList
    plural: materialcatalogs
    singular: materialcatalog
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    name: v1alpha1
    schema:
      description: MaterialCatalog is the Schema for the materialcatalogs API
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: |-
            MaterialCatalogSpec defines the desired state of MaterialCatalog.

            Unlike MaterialSubmission, this is a singleton per account - it exists
            purely to browse StrömungsRaum's existing materials into status, not to
            create new ones.
          properties:
            refreshRequestedAt:
              description: |-
                RefreshRequestedAt is bumped by the UI's Refresh button to request the
                reconciler re-fetch the account's Materials from the StrömungsRaum
                backend, populating status.availableMaterials. Any change to this
                value triggers a refresh; the value itself is otherwise opaque.
              type: string
            secretRefs:
              description: SecretRefs is an array of references to Secrets containing
                SIMOD credentials
              items:
                description: |-
                  SecretReference references a Secret by name in the same namespace as the
                  resource that holds the reference.
                properties:
                  name:
                    description: Name of the referenced Secret
                    type: string
                required:
                - name
                type: object
              type: array
          type: object
        status:
          description: MaterialCatalogStatus defines the observed state of MaterialCatalog
          properties:
            availableMaterials:
              description: |-
                AvailableMaterials lists the StrömungsRaum backend's existing
                Materials for this account, as of the last refresh.
              items:
                description: |-
                  MaterialSummary is a condensed view of a StrömungsRaum Material, enough to
                  populate the portal's catalog browse view.
                properties:
                  createdAt:
                    description: CreatedAt is when the material was created on the
                      StrömungsRaum backend.
                    type: string
                  id:
                    description: ID is the uuid the StrömungsRaum backend assigned
                      to this material.
                    type: string
                  name:
                    description: Name is the material's name on the StrömungsRaum
                      backend.
                    type: string
                required:
                - createdAt
                - id
                - name
                type: object
              type: array
            lastProcessedRefreshRequestedAt:
              description: |-
                LastProcessedRefreshRequestedAt mirrors spec.refreshRequestedAt as of
                the last successful fetch. The reconciler compares this against the
                current spec value to decide whether a new refresh was requested,
                rather than reacting to every reconcile (a status-only update doesn't
                change metadata.generation, so without this marker the reconciler
                would re-fetch on every reconcile it itself triggers).
              type: string
            lastRefreshedAt:
              description: |-
                LastRefreshedAt is the RFC3339 timestamp of the last successful
                available-materials fetch from the StrömungsRaum backend.
              type: string
            message:
              description: Message carries error details when Phase is Failed.
              type: string
            phase:
              description: 'Phase is the current reconciliation phase: Pending, Ready,
                or Failed.'
              type: string
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
