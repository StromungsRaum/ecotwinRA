apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v261105-83eb0e2.materialsubmissions.materials.platform-mesh.io
spec:
  group: materials.platform-mesh.io
  names:
    kind: MaterialSubmission
    listKind: MaterialSubmissionList
    plural: materialsubmissions
    singular: materialsubmission
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.materialId
      name: MaterialID
      type: string
    name: v1alpha1
    schema:
      description: MaterialSubmission is the Schema for the materialsubmissions API
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: |-
            MaterialSubmissionSpec defines the desired state of MaterialSubmission.
            Each MaterialSubmission submits at most one material to StrömungsRaum -
            like InjectionMoldingService, the portal creates one of these per card via
            its "+" button, not one shared resource per account.
          properties:
            material:
              description: |-
                Material is the full material characterization to submit, copied by
                the portal from the chosen SKZ Material at creation time. The
                StrömungsRaum backend's materials endpoint has no update route, so the
                reconciler only ever creates once (see status.materialId).
              properties:
                abs_max_melt_temp:
                  type: number
                data:
                  description: MaterialData is the Material's general/physical data
                    section.
                  properties:
                    density:
                      type: number
                    heatcapacity:
                      type: number
                    heatconductivity:
                      type: number
                    material_number:
                      type: string
                    norm:
                      type: string
                    type:
                      type: string
                  required:
                  - density
                  - heatcapacity
                  - heatconductivity
                  - material_number
                  - norm
                  - type
                  type: object
                eject_temp:
                  type: number
                freeze_temp:
                  type: number
                heatModel:
                  description: HeatModel is the Material's heat model (e.g. a "Tabulated"
                    model).
                  properties:
                    model:
                      type: string
                    thermaldata:
                      items:
                        description: |-
                          ThermalDataPoint is one row of HeatModel.Thermaldata - temperature-indexed
                          heat/density data.
                        properties:
                          density:
                            type: number
                          heatcapacity:
                            type: number
                          heatconductivity:
                            type: number
                          temperature:
                            type: number
                        required:
                        - density
                        - heatcapacity
                        - heatconductivity
                        - temperature
                        type: object
                      type: array
                  required:
                  - model
                  - thermaldata
                  type: object
                max_melt_temp:
                  type: number
                max_shear_rate:
                  type: number
                max_shear_stress:
                  type: number
                mech_properties:
                  description: MechProperties are the Material's mechanical properties.
                  properties:
                    E_avg:
                      type: number
                    E1:
                      type: number
                    E2:
                      type: number
                    G12:
                      type: number
                    alpha_1:
                      type: number
                    alpha_2:
                      type: number
                    v12:
                      type: number
                    v23:
                      type: number
                  required:
                  - E1
                  - E2
                  - E_avg
                  - G12
                  - alpha_1
                  - alpha_2
                  - v12
                  - v23
                  type: object
                melt_density:
                  type: number
                min_melt_temp:
                  type: number
                name:
                  type: string
                pvtmodel:
                  description: |-
                    PVTModel is the Material's pressure-volume-temperature model (e.g. a
                    "tait" model).
                  properties:
                    b1m:
                      type: number
                    b1s:
                      type: number
                    b2m:
                      type: number
                    b2s:
                      type: number
                    b3m:
                      type: number
                    b3s:
                      type: number
                    b4m:
                      type: number
                    b4s:
                      type: number
                    b5:
                      type: number
                    b6:
                      type: number
                    b7:
                      type: number
                    b8:
                      type: number
                    b9:
                      type: number
                    model:
                      type: string
                  required:
                  - b1m
                  - b1s
                  - b2m
                  - b2s
                  - b3m
                  - b3s
                  - b4m
                  - b4s
                  - b5
                  - b6
                  - b7
                  - b8
                  - b9
                  - model
                  type: object
                rawJson:
                  description: |-
                    RawJSON is the source SKZ Material's verbatim pasted/uploaded JSON,
                    copied through unchanged - forwarded to StrömungsRaum as "Temporary
                    Material Data" on submission (see pkg/simod.MaterialRequest.Temporary).
                  type: string
                shrinkage_properties:
                  description: ShrinkageProperties are the Material's shrinkage properties.
                  properties:
                    avg_nominal:
                      type: number
                    parallel:
                      type: number
                    perpendicular:
                      type: number
                  required:
                  - avg_nominal
                  - parallel
                  - perpendicular
                  type: object
                solid_density:
                  type: number
                structure:
                  type: string
                tempModel:
                  description: TempModel is the Material's temperature-shift model
                    (e.g. a "c1c2" model).
                  properties:
                    D3:
                      type: number
                    c1:
                      type: number
                    c2:
                      type: number
                    model:
                      type: string
                    referenceTemperature:
                      type: number
                  required:
                  - D3
                  - c1
                  - c2
                  - model
                  - referenceTemperature
                  type: object
                viscoModel:
                  description: ViscoModel is the Material's viscosity model (e.g.
                    a "cross" model).
                  properties:
                    critical_stress_level:
                      type: number
                    exponent:
                      type: number
                    model:
                      type: string
                    zero_viscosity:
                      type: number
                  required:
                  - critical_stress_level
                  - exponent
                  - model
                  - zero_viscosity
                  type: object
              required:
              - abs_max_melt_temp
              - data
              - eject_temp
              - freeze_temp
              - heatModel
              - max_melt_temp
              - max_shear_rate
              - max_shear_stress
              - mech_properties
              - melt_density
              - min_melt_temp
              - name
              - pvtmodel
              - shrinkage_properties
              - solid_density
              - structure
              - tempModel
              - viscoModel
              type: object
            secretRefs:
              description: SecretRefs is an array of references to Secrets containing
                SIMOD credentials
              items:
                description: |-
                  SecretReference references a Secret by name in the same namespace as the
                  resource that holds the reference.
                properties:
                  name:
                    description: Name of the referenced Secret
                    type: string
                required:
                - name
                type: object
              type: array
            sourceMaterialRef:
              description: |-
                SourceMaterialRef records which SKZ Material this submission's data
                came from, for display only.
              properties:
                name:
                  type: string
                namespace:
                  type: string
              required:
              - name
              - namespace
              type: object
          type: object
        status:
          description: MaterialSubmissionStatus defines the observed state of MaterialSubmission
          properties:
            materialId:
              description: |-
                MaterialID is the StrömungsRaum backend uuid assigned to this material
                once submitted.
              type: string
            materialUrl:
              description: |-
                MaterialURL is the public SIMOD web UI link to the newly created
                material (https://<env>.simod.de/material/<uuid>), set alongside
                MaterialID once submitted.
              type: string
            message:
              description: Message carries error details when Phase is Failed.
              type: string
            phase:
              description: 'Phase is the current reconciliation phase: Pending, Ready,
                or Failed.'
              type: string
            submittedAt:
              description: SubmittedAt is the RFC3339 timestamp this material was
                submitted at.
              type: string
          type: object
      type: object
    served: true
    storage: true
    subresources:
      status: {}
