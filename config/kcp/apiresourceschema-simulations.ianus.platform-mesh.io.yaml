apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v260907-e9c64e5.simulations.ianus.platform-mesh.io
spec:
  group: ianus.platform-mesh.io
  names:
    kind: Simulation
    listKind: SimulationList
    plural: simulations
    singular: simulation
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.simulationStatus
      name: Status
      type: string
    name: v1alpha1
    schema:
      description: Simulation is the Schema for the simulations API
      properties:
        apiVersion:
          description: |-
            APIVersion defines the versioned schema of this representation of an object.
            Servers should convert recognized schemas to the latest internal value, and
            may reject unrecognized values.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
          type: string
        kind:
          description: |-
            Kind is a string value representing the REST resource this object represents.
            Servers may infer this from the endpoint the client submits requests to.
            Cannot be updated.
            In CamelCase.
            More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
          type: string
        metadata:
          type: object
        spec:
          description: SimulationSpec defines the desired state of Simulation
          properties:
            digitalTwinRef:
              description: |-
                DigitalTwinRef references the DigitalTwin this simulation runs against.
                It must reach phase Ready before the simulation can be created.
              properties:
                name:
                  description: Name of the referenced resource
                  type: string
              required:
              - name
              type: object
            executionParameterRef:
              description: |-
                ExecutionParameterRef references the ExecutionParameter whose token is
                redeemed to create this simulation. It must reach phase Ready before
                the simulation can be created.
              properties:
                name:
                  description: Name of the referenced resource
                  type: string
              required:
              - name
              type: object
            secretRefs:
              description: SecretRefs is an array of references to Secrets containing
                SIMOD credentials
              items:
                description: |-
                  SecretReference references a Secret by name in the same namespace as the
                  resource that holds the reference.
                properties:
                  name:
                    description: Name of the referenced Secret
                    type: string
                required:
                - name
                type: object
              type: array
          required:
          - digitalTwinRef
          - executionParameterRef
          type: object
        status:
          description: SimulationStatus defines the observed state of Simulation
          properties:
            message:
              description: Message carries error details when Phase is Failed.
              type: string
            phase:
              description: 'Phase is the current reconciliation phase: Pending, Ready,
                or Failed.'
              type: string
            simulationId:
              description: SimulationID is the uuid the SIMOD backend assigned to
                this simulation.
              type: string
            simulationStatus:
              description: |-
                SimulationStatus is the backend's own simulation status (e.g.
                processing, complete, error) - distinct from Phase, which only tracks
                whether this CR's create call has been made.
              type: string
          type: object
