apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: materials-controller
rules:
  # Full access to the MaterialCatalog and MaterialSubmission resources
  - apiGroups: ["materials.platform-mesh.io"]
    resources: ["materialcatalogs", "materialsubmissions"]
    verbs: ["list", "get", "watch"]
  - apiGroups: ["materials.platform-mesh.io"]
    resources: ["materialcatalogs/status", "materialsubmissions/status"]
    verbs: ["get", "update", "patch"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Access to APIExport for controller operations
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexports/content"]
    verbs: ["*"]
  - apiGroups: ["apis.kcp.io"]
    resources: ["apiexportendpointslices"]
    verbs: ["get", "list", "watch"]
