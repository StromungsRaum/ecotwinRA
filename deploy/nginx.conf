pid /tmp/nginx.pid;

# the events block is required
events{}

http {
    # include the default mime.types to map file extensions to MIME types
    include /etc/nginx/mime.types;

    server {
        listen 8080;

        root /usr/share/nginx/html;
        index index.html;

        # CORS headers for microfrontend access
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";

        # Serve Angular app under /injection-molding path
        location /injection-molding {
            alias /usr/share/nginx/html;
            try_files $uri $uri/ /injection-molding/index.html;

            # The SPA shell (index.html, reached via the try_files fallback
            # above) has no content hash in its filename, unlike main-*.js /
            # styles-*.css - without this, browsers apply heuristic caching
            # and keep serving a pre-redeploy shell (referencing bundle
            # filenames that no longer exist on disk) for days after a
            # redeploy. Force revalidation on every load instead.
            add_header Cache-Control "no-store";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Serve Angular app under /skz path
        location /skz {
            alias /usr/share/nginx/html;
            try_files $uri $uri/ /skz/index.html;
            add_header Cache-Control "no-store";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Serve Angular app under /materials path
        location /materials {
            alias /usr/share/nginx/html;
            try_files $uri $uri/ /materials/index.html;
            add_header Cache-Control "no-store";

            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE";
                add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization";
                add_header Access-Control-Max-Age 86400;
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # Redirect root to /injection-molding
        location = / {
            return 302 /injection-molding/;
        }

        location /healthz {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
