apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "materials-controller.fullname" . }}
  labels:
    {{- include "materials-controller.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "materials-controller.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "materials-controller.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "materials-controller.serviceAccountName" . }}
{{ include "common.hostAliases" $ | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "materials-controller.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpointslice={{ .Values.controller.endpointSlice }}
            - --simod-base-url={{ .Values.controller.simodBaseURL }}
          env:
            - name: KUBECONFIG
              value: /etc/kcp/kubeconfig
            {{- if .Values.devCaBundle.enabled }}
            - name: SSL_CERT_FILE
              value: /etc/ssl/certs/ca-certificates.crt
            {{- end }}
          ports:
            - name: metrics
              containerPort: 9080
              protocol: TCP
            - name: health
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/kcp
              readOnly: true
            {{- if .Values.devCaBundle.enabled }}
            - name: dev-ca-bundle
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}
      volumes:
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubeconfig.secretName }}
            items:
              - key: {{ .Values.kubeconfig.secretKey }}
                path: kubeconfig
        {{- if .Values.devCaBundle.enabled }}
        - name: dev-ca-bundle
          configMap:
            name: {{ .Values.devCaBundle.configMapName }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
