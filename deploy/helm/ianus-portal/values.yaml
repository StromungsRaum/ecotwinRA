replicaCount: 1

image:
  repository: ghcr.io/platform-mesh/ianus-portal
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 101

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: portal.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

httpRoute:
  enabled: false
  namespace: platform-mesh-system
  hostnames:
    - pm.127-0-0-1.sslip.io
    - "*.pm.127-0-0-1.sslip.io"
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: k8sapi-gateway
      namespace: platform-mesh-system
  pathPrefixes:
    - /injection-molding
    - /skz
    - /materials
  filters:
    - extensionRef:
        group: traefik.io
        kind: Middleware
        name: ianus-portal-cors
      type: ExtensionRef
  referenceGrant:
    enabled: true
    fromNamespace: platform-mesh-system

middleware:
  enabled: false
  namespace: platform-mesh-system
  corsOrigins:
    - http://localhost:4200
    - http://*.localhost:4200
    - https://pm.127-0-0-1.sslip.io:8443
    - https://*.pm.127-0-0-1.sslip.io:8443

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
