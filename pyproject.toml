[project]
name = "ecotwin"
version = "0.1.0"
description = "ECOTWIN Reference Architecture"
authors = [
    { name = "Michael Bulinski", email = "m.bulinski@ianus-simulation.de" },
    { name = "Markus Geveler", email = "m.geveler@ianus-simulation.de" },
    { name = "Sava Slijepčević", email = "s.slijepcevic@ianus-simulation.de" },
]
requires-python = ">=3.11"
dependencies = [
    "beeprint>=2.4.11",
    "typer>=0.9.0",
    "pyyaml>=6.0.2",
    "fastapi[standard]>=0.135.2",
    "requests>=2.32.5",
    "loguru>=0.7.3",
]
readme = "README.md"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecotwin*"]
