[project]
name = "ecotwin"
version = "0.1.0"
description = "ECOTWIN Reference Architecture"
authors = [
    { name = "Michael Bulinski", email = "m.bulinski@ianus-simulation.de" },
    { name = "Markus Geveler", email = "m.geveler@ianus-simulation.de" },
    { name = "Sava Slijepčević", email = "s.slijepcevic@ianus-simulation.de" },
]
requires-python = ">=3.11"
dependencies = [
    "beeprint>=2.4.11",
    "click>=8.3.0",
    "pyyaml>=6.0.2",
]
readme = "README.md"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ecotwin*"]

# [tool.setuptools]
# packages = ["src"]

[project.scripts]
twinctl = "ecotwin.twinctl:twinctl"
