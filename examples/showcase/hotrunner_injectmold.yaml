industrial_processes:
  hotrunner-process:
    name: HotrunnerProcess
    description: An industrial process heating and distributing a flowchannel filled with polymer melt fluid flow 
    digital_twin: hotrunner-dt
  injection-molding-process:
    name: InjectMoldProcess
    description: An industrial process filling a cavity with polymer melt fluid flow 
    digital_twin: injectmold-dt

digital_twins:
  hotrunner-dt:
    name: HotrunnerTwin
    description: A digital twin for the hotrunner process based on a STEP upload and several hifi an ai models
    applications:
      - hotrunner-heat-hifi
      - hotrunner-sensor-genai
      - hotrunner-hepos-genai
    sensors:
      - temperature-sensor
      - flowrate-sensor

  injectmold-dt:
    name: InjectMoldTwin
    description: A digital twin for the injectmold process based on STEP file upload an a hifi model
    applications:
      - injectmold-flow-hifi
    sensors:
      - pressure-sensor

applications:
  hotrunner-heat-hifi:
    type: HeatSimulation
    description: 
    model: tudo-featflower-heat-model
    data-bridges:
      - temperature-sensor
      - flowrate-sensor
  hotrunner-sensor-genai:
    type: ConstructionAssistant
    description: 
    model: ianus-sensorgsp-genai-model
  hotrunner-hepos-genai:
    type: ConstructionAgent
    description: 
    model: ianus-hepos-genai-model
  injectmold-flow-hifi:
    type: FlowSimulation
    description: 
    model: tuda-flow-model
    data-bridges:
      - pressure-sensor

models:
  tudo-featflower-heat-model:
    name: FeatflowerHeat
    type: PDESimulation
    description: A hi-fi model for simulating heat distribution in hotrunner systems
  ianus-sensorgsp-genai-model:
    name: IANUSSensorGSP
    type: Optimizer
    description: A generative AI model for designing sensor placements in hotrunner systems
  ianus-hepos-genai-model:
    name: IANUSHePos
    type: OptimizerAgent
    description: A generative AI agent for optimizing heater positions in hotrunner systems
  tuda-flow-model:
    name: OpenFAOMFlow
    type: PDESimulation
    description: A hi-fi model for simulating fluid flow in injection molding processes 

sensors:
  temperature-sensor:
    name: TemperatureSensor
    type: Temperature
    description: A sensor measuring temperature in hotrunner systems
  flowrate-sensor:
    name: FlowRateSensor
    type: FlowRate
    description: A sensor measuring flow rate in hotrunner systems 
  pressure-sensor:
    name: PressureSensor
    type: Pressure
    description: A sensor measuring pressure in injection molding systems
