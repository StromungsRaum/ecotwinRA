# Purpose: Run the containerized ECOTWIN API service that queries the StrömungsRaum portfolio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecotwin-api
  namespace: simod-system
  labels:
    app.kubernetes.io/name: ecotwin-api
    app.kubernetes.io/component: portfolio-declaration-service
    app.kubernetes.io/part-of: ecotwin
    simod.de/service: portfolio-declaration-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ecotwin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ecotwin-api
        app.kubernetes.io/component: portfolio-declaration-service
        app.kubernetes.io/part-of: ecotwin
        simod.de/service: portfolio-declaration-api
    spec:
      containers:
        - name: ecotwin-api
          image: ecotwin-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: BACKEND_URL_INT
              valueFrom:
                configMapKeyRef:
                  name: simod-backend-config
                  key: BACKEND_URL_INT
            - name: BACKEND_URL_PROD
              valueFrom:
                configMapKeyRef:
                  name: simod-backend-config
                  key: BACKEND_URL_PROD
            - name: BACKEND_URL_TEST
              valueFrom:
                configMapKeyRef:
                  name: simod-backend-config
                  key: BACKEND_URL_TEST
            - name: BACKEND_URL_DEV
              valueFrom:
                configMapKeyRef:
                  name: simod-backend-config
                  key: BACKEND_URL_DEV
            - name: EMAIL
              valueFrom:
                secretKeyRef:
                  name: simod-backend-login
                  key: EMAIL
            - name: PASSWD
              valueFrom:
                secretKeyRef:
                  name: simod-backend-login
                  key: PASSWD
            - name: EMAIL_INT
              valueFrom:
                secretKeyRef:
                  name: simod-backend-login
                  key: EMAIL
            - name: PASSWD_INT
              valueFrom:
                secretKeyRef:
                  name: simod-backend-login
                  key: PASSWD
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
