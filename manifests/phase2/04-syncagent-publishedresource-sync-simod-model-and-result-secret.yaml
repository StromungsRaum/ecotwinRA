# Purpose: Publishes simod.de Model resources and syncs the MSP-created result Secret back to the Platform Mesh workspace.
apiVersion: syncagent.kcp.io/v1alpha1
kind: PublishedResource
metadata:
  name: publish-simod-injectmold-models
spec:
  resource:
    kind: Model
    apiGroup: simod.de
    versions:
      - v1alpha1

  # Keeps objects from different kcp workspaces collision-free inside the MSP service cluster.
  naming:
    namespace: "{{ .ClusterName }}"
    name: "{{ .Object.metadata.namespace | sha3short }}-{{ .Object.metadata.name | sha3short }}"

  # The ecotwin-operator creates this Secret in the MSP cluster after completion.
  # The syncagent syncs it back to the originating workspace when permission claims are accepted.
  related:
    - identifier: result-secret
      origin: service
      group: ""
      version: v1
      resource: secrets
      object:
        template:
          template: "{{ .Object.status.results.credentialsSecretName }}"
