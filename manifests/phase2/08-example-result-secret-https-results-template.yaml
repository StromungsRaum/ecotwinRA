# Purpose: Example result Secret with normal HTTPS links for simod.de results.
apiVersion: v1
kind: Secret
metadata:
  name: injectmold-run-001-results
  namespace: demo-workspace
  annotations:
    platform-mesh.io/synced-from-msp: "true"
type: Opaque
stringData:
  REPORT_URL: "https://www.simod.de/results/injectmold-run-001/report.html"
  DATA_URL: "https://www.simod.de/results/injectmold-run-001/simulation-data.vtk"
  VISUALIZATION_URL: "https://www.simod.de/results/injectmold-run-001/visualization.mp4"
  ACCESS_TOKEN: "REPLACE_ME"
